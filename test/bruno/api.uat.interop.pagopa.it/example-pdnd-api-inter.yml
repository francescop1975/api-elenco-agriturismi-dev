info:
  name: example-pdnd-api-inter
  type: http
  seq: 1

http:
  method: GET
  url: https://api.uat.interop.pagopa.it/v3/clients?offset=0&limit=10
  params:
    - name: offset
      value: "0"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Esempio di invocazione di una API esposta da PDND Interoperabilità.

  Per eseguirla, utilizzare un client di tipo API Interoperabilità e configurare nel Global Env:
  - chiave privata del client interoperabilità
  - chiave pubblica del client interoperabilità
  - kid della chiave pubblica del client interoperabilità
  - client id  del client interoperabilità


  **Testato con Voucher di tipo DPoP ed API V3**
